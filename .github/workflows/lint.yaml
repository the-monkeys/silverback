name: Lint

on: [push]

jobs:
  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup bun
        shell: bash
        run: |
          cp -r ~/.bun ${{ github.workspace }}/

          export BUN_INSTALL="${{ github.workspace }}/.bun"

          echo $BUN_INSTALL/bin:$PATH >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install

      - name: check code
        run: bun lint

      - name: format code
        run: bun format -- --check
